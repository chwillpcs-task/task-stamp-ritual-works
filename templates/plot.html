<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Honor Plot LIFF</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f8f9fa;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 16px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #06C755;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #05b34c;
        }
        .notice {
            margin-top: 20px;
            padding: 12px;
            background-color: #fff3cd;
            border: 1px solid #ffeeba;
            color: #856404;
            border-radius: 6px;
            font-size: 13px;
            line-height: 1.4;
        }
        #result {
            margin-top: 16px;
            padding: 12px;
            border-radius: 6px;
            display: none;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Honor Plot</h1>
        <form id="plotForm">
            <div class="form-group">
                <label for="place">Place</label>
                <input type="text" id="place" name="place" placeholder="Enter place" required>
            </div>
            <div class="form-group">
                <label for="era">Era</label>
                <input type="text" id="era" name="era" placeholder="Enter era" required>
            </div>
            <div class="form-group">
                <label for="story">Story</label>
                <textarea id="story" name="story" placeholder="Enter story" required></textarea>
            </div>
            <button type="submit" id="submitBtn">Submit Plot</button>
        </form>

        <div id="result"></div>

        <div class="notice">
            <strong>Non-Custodial Symbolic Tribute Notice:</strong> All submissions and tributes are non-custodial and symbolic.
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            liff.init({ liffId: '2010758069-kl2x26d9' })
                .then(() => {
                    console.log('LIFF initialized successfully');
                })
                .catch((err) => {
                    console.error('LIFF initialization failed', err);
                });

            document.getElementById('plotForm').addEventListener('submit', function(e) {
                e.preventDefault();
                const place = document.getElementById('place').value;
                const era = document.getElementById('era').value;
                const story = document.getElementById('story').value;

                fetch('/plot', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ place: place, era: era, story: story })
                })
                .then(response => response.json())
                .then(data => {
                    const resultDiv = document.getElementById('result');
                    resultDiv.className = 'success';
                    resultDiv.style.display = 'block';
                    resultDiv.innerText = 'Submitted successfully!';
                })
                .catch(err => {
                    const resultDiv = document.getElementById('result');
                    resultDiv.className = 'error';
                    resultDiv.style.display = 'block';
                    resultDiv.innerText = 'Submission failed.';
                });
            });
        });
    </script>
</body>
</html>
